name: Supabase keep-alive

# Pings the Supabase REST endpoint every 5 days so the free-tier project
# does not auto-pause after 7 days of inactivity.

on:
  schedule:
    - cron: '17 6 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /rest/v1/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret"
            exit 1
          fi
          curl -fsS \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            > /dev/null
          echo "Ping OK at $(date -u +%FT%TZ)"
